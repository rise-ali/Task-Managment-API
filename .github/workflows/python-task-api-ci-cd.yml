name: Python Task API CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # ← Bu satırı ekleyin

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Python 3.11 Kurulumu
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Bağımlılıkları Yükle
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort pylint
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: Black Code Formatting Kontrolü
      run: black --check .
    
    - name: isort Import Sırası Kontrolü
      run: isort --check-only .
    
    - name: Flake8 Linting
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    
    - name: Pylint Kontrolü
      run: pylint **/*.py --fail-under=7.0 || true

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: task_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Python ${{ matrix.python-version }} Kurulumu
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Bağımlılıkları Yükle
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-asyncio
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: Testleri Çalıştır
      run: pytest tests/ -v --cov=app --cov-report=xml --cov-report=term
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/task_db
    
    - name: Coverage Raporunu Yükle
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Python Kurulumu
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Bağımlılıkları Yükle
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety
    
    - name: Bandit Security Taraması
      run: bandit -r app/ -f json -o bandit-report.json || true
    
    - name: Safety Dependency Check
      run: safety check --json || true

  build:
    needs: [lint-and-format, test]
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Python Kurulumu
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Bağımlılıkları Yükle
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: Build Artifacts Oluştur
      run: |
        mkdir -p build
        cp -r app build/
        cp requirements.txt build/
        cp config.py build/ || true
    
    - name: Artifacts Yükle
      uses: actions/upload-artifact@v3
      with:
        name: python-build
        path: build/
        retention-days: 5

  deploy:
    needs: [lint-and-format, test, security-scan, build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Build Artifacts İndir
      uses: actions/download-artifact@v3
      with:
        name: python-build
    
    - name: Python Kurulumu
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Production'a Deploy Et
      run: |
        echo "Deploying Python Task API to production..."
        # Buraya kendi deployment komutunuzu yazın
        # Örnek: pip install -r requirements.txt && gunicorn app:app
